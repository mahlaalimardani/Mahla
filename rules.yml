version: "3.1"

rules:

- rule: Start triage on emergency report
  steps:
    - intent: report_emergency
    - action: utter_safety_disclaimer
    - action: triage_form
    - active_loop: triage_form

- rule: Start triage on help request
  steps:
    - intent: request_help
    - action: utter_safety_disclaimer
    - action: triage_form
    - active_loop: triage_form

- rule: Start triage when hazard is provided directly
  steps:
    - intent: provide_hazard
    - action: utter_safety_disclaimer
    - action: triage_form
    - active_loop: triage_form

- rule: Submit triage form -> assess risk
  condition:
    - active_loop: triage_form
  steps:
    - action: triage_form
    - active_loop: null
    - action: action_risk_assessment
    - action: action_human_handover

- rule: Shelter lookup
  steps:
    - intent: ask_shelter
    - action: action_shelter_lookup

- rule: Greet
  steps:
    - intent: greet
    - action: utter_greet

- rule: First aid
  steps:
    - intent: ask_first_aid
    - action: utter_first_aid_basic

- rule: Evacuation
  steps:
    - intent: ask_evacuation
    - action: utter_evacuation_general

- rule: Out of scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: NLU fallback
  steps:
    - intent: nlu_fallback
    - action: action_default_fallback
- rule: Safety steps
  steps:
    - intent: ask_safety_steps
    - action: utter_safety_steps
- rule: Affirm acknowledgement
  steps:
    - intent: affirm
    - action: utter_acknowledge
- rule: Goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye
